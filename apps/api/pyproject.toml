[project]
name = "book-learning-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "pypdf>=5,<6",
  "pypdfium2>=5.12.1",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
advanced-parsing = [
  "docling>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
